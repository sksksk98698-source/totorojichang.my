<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="龙猫机场 Totoro Jichang Avatar">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="totoroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base for Theme Avatar -->
  <circle cx="110" cy="110" r="110" fill="url(#bgGrad)" />
  <circle cx="110" cy="110" r="107" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Subtle Network Constellation Behind -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.25">
    <line x1="30" y1="50" x2="70" y2="30" />
    <line x1="70" y1="30" x2="150" y2="30" />
    <line x1="150" y1="30" x2="190" y2="50" />
    <circle cx="30" cy="50" r="3" fill="#38bdf8" />
    <circle cx="70" cy="30" r="2.5" fill="#38bdf8" />
    <circle cx="150" cy="30" r="2.5" fill="#38bdf8" />
    <circle cx="190" cy="50" r="3" fill="#38bdf8" />
  </g>

  <!-- Totoro Silhouette / Ears -->
  <!-- Left Ear -->
  <path d="M72 75 Q68 32 78 28 Q88 32 86 72 Z" fill="url(#totoroGrad)" />
  <!-- Right Ear -->
  <path d="M148 75 Q152 32 142 28 Q132 32 134 72 Z" fill="url(#totoroGrad)" />

  <!-- Totoro Body -->
  <path d="M52 165 C45 115 65 65 110 65 C155 65 175 115 168 165 C164 195 142 208 110 208 C78 208 56 195 52 165 Z" fill="url(#totoroGrad)" />

  <!-- Belly -->
  <path d="M72 165 C68 135 80 115 110 115 C140 115 152 135 148 165 C145 190 135 198 110 198 C85 198 75 190 72 165 Z" fill="url(#bellyGrad)" />

  <!-- Belly Marks (Totoro signature chevrons) -->
  <g fill="#2563eb" opacity="0.8">
    <path d="M102 134 Q110 128 118 134 Q110 131 102 134 Z" stroke="#2563eb" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M88 145 Q96 139 104 145 Q96 142 88 145 Z" stroke="#2563eb" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M116 145 Q124 139 132 145 Q124 142 116 145 Z" stroke="#2563eb" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Big Glowing Eyes -->
  <circle cx="86" cy="98" r="10" fill="#ffffff" />
  <circle cx="86" cy="98" r="5" fill="#0f172a" />
  <circle cx="88" cy="96" r="2" fill="#38bdf8" filter="url(#glow)" />

  <circle cx="134" cy="98" r="10" fill="#ffffff" />
  <circle cx="134" cy="98" r="5" fill="#0f172a" />
  <circle cx="136" cy="96" r="2" fill="#38bdf8" filter="url(#glow)" />

  <!-- Nose -->
  <ellipse cx="110" cy="103" rx="5" ry="3.5" fill="#0f172a" />

  <!-- Tech Whiskers -->
  <g stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <line x1="50" y1="106" x2="72" y2="108" />
    <line x1="48" y1="115" x2="70" y2="114" />
    <line x1="170" y1="106" x2="148" y2="108" />
    <line x1="172" y1="115" x2="150" y2="114" />
  </g>

  <!-- Antenna / Network Signal Indicator -->
  <circle cx="110" cy="22" r="3" fill="#38bdf8" filter="url(#glow)" />
  <line x1="110" y1="25" x2="110" y2="35" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>
